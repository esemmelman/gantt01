<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gantt — Project planner</title><link rel="stylesheet" href="style.css?v=1.6.1"></head>
<body><aside class="rail"><div class="logo">g<span>▰</span></div><div class="rail-icon active" title="Timeline">▤</div><div class="rail-bottom">G</div></aside><main><section class="board"><div class="toolbar"><div class="tabs"><span class="selected">▥ &nbsp; Gantt view</span><span class="shared">Shared workspace</span></div><div class="tools"><button id="add" class="primary">＋ Add node</button><input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks"><button id="expand">Expand all</button><button id="contract">Collapse all</button><button id="today">Today</button><select id="zoom" aria-label="Timeline zoom"><option value="30">Days</option><option value="16">Weeks</option><option value="7">Months</option></select><button id="export">Export CSV</button></div></div><div id="gantt-scope" class="gantt-scope" hidden><button id="all-nodes">← All nodes</button><span id="scope-title"></span></div><div id="chart" class="chart"><div class="loading">Loading your timeline…</div></div><footer><div class="connection"><span class="live-dot"></span><span id="status" role="status">Connecting…</span><button id="refresh" class="text-button">Refresh</button></div><span>Click a top-level node for Doc, Gantt, Check, or Edit · Drag a bar to reschedule · Drag its right edge to resize</span><span class="version" aria-label="App version">v1.6.1</span></footer></section><div id="error" role="alert" hidden></div></main>
<dialog id="editor"><form id="task-form"><div class="dialog-heading"><div><div class="eyebrow">MAKE ROOM FOR WHAT’S NEXT</div><h2 id="dialog-title">New task</h2></div><button type="button" id="close" aria-label="Close">×</button></div><label>Task name<input name="title" required maxlength="200" placeholder="What needs to happen?"></label><label>Parent task<select name="parent_id"></select></label><label class="no-date"><input name="completed" type="checkbox"> Completed</label><label class="no-date"><input name="no_date" type="checkbox"> No date</label><div class="form-grid"><label>Start date<input name="start_date" type="date" required></label><label>End date<input name="end_date" type="date" required></label><label>Bar color<input name="color" type="color"></label></div><label>Notes<textarea name="notes" rows="3" placeholder="Add a little context…"></textarea></label><div id="form-error" role="alert"></div><div class="dialog-actions"><button type="button" id="delete" class="danger">Delete task</button><div><button type="button" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Save task</button></div></div></form></dialog><script type="module" src="app.js?v=1.6.1"></script></body></html>
